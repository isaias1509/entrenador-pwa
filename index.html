<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mi Gym App</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0e" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mi Gym" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="app" id="pantalla-hoy">
    <section class="card" id="config-inicial" hidden>
      <h2>Antes de empezar</h2>
      <p>¿Qué día arrancaste (o arrancas) tu programa? Esto solo lo pregunto una vez, sirve para calcular en qué semana vas.</p>
      <input type="date" id="input-fecha-inicio" />
      <button class="btn-primario" id="btn-guardar-fecha">Guardar</button>
    </section>

    <div id="contenido-hoy" hidden>
      <section class="modo-prueba">
        <label for="selector-dia-prueba">🧪 Ver rutina de:</label>
        <select id="selector-dia-prueba">
          <option value="actual">Hoy (día real)</option>
          <option value="1">Lunes</option>
          <option value="2">Martes</option>
          <option value="3">Miércoles</option>
          <option value="4">Jueves</option>
          <option value="5">Viernes</option>
          <option value="6">Sábado</option>
          <option value="0">Domingo</option>
        </select>
      </section>

      <header class="app-header">
        <h1 id="fecha">Cargando fecha...</h1>
        <p class="semana-actual" id="semana-actual"></p>
      </header>

      <section class="card rutina-card">
        <h2 id="nombre-rutina">—</h2>
        <div id="calentamiento-bloque"></div>
        <div id="lista-ejercicios"></div>
        <div id="cardio-bloque"></div>
        <div id="boxeo-bloque"></div>
        <div id="boxeo-opcional-bloque"></div>
      </section>

      <button class="btn-primario btn-grande" id="btn-comenzar">
        Comenzar entrenamiento
      </button>
    </div>

  </main>

  <!-- Pantalla de entrenamiento -->
  <main class="app" id="pantalla-entrenamiento" hidden>
    <header class="app-header header-entrenamiento">
      <button class="btn-texto" id="btn-salir-entrenamiento">← Salir</button>
      <h1 id="nombre-rutina-entrenamiento">—</h1>
    </header>

    <section class="card ejercicio-actual-card">
      <p class="progreso-ejercicio" id="progreso-ejercicio-global"></p>
      <h2 id="nombre-ejercicio-actual">—</h2>
      <p class="ejercicio-rango" id="rango-ejercicio-actual"></p>
      <p class="ultima-sesion" id="ultima-sesion-info"></p>

      <div class="serie-indicador" id="serie-indicador"></div>
      <div class="lado-indicador" id="lado-indicador" hidden></div>

      <div class="campos-serie" id="campos-serie-reps">
        <label>Peso (kg)
          <input type="number" id="input-peso" inputmode="decimal" step="0.5" />
        </label>
        <label>Repeticiones
          <input type="number" id="input-reps" inputmode="numeric" />
        </label>
        <label>RIR / dificultad (opcional)
          <input type="text" id="input-rir" placeholder="ej. 2 en reserva" />
        </label>
      </div>

      <div class="campos-serie" id="campos-serie-tiempo" hidden>
        <label>Segundos sostenidos
          <input type="number" id="input-segundos" inputmode="numeric" />
        </label>
      </div>

      <button class="btn-primario" id="btn-completar-serie">Completar serie</button>

      <section class="descanso-card" id="descanso-card">
        <div class="descanso-encabezado">
          <div>
            <p class="descanso-etiqueta">Descanso</p>
            <p class="descanso-estado" id="descanso-estado">Listo para iniciar</p>
          </div>
          <label class="switch-descanso">
            <input type="checkbox" id="check-descanso-automatico" checked />
            <span>Automático</span>
          </label>
        </div>

        <div class="cronometro" id="cronometro-descanso">00:00</div>

        <div class="controles-tiempo">
          <button class="btn-tiempo" id="btn-restar-15">−15 s</button>
          <button class="btn-primario btn-descanso" id="btn-iniciar-descanso">Iniciar descanso</button>
          <button class="btn-tiempo" id="btn-sumar-15">+15 s</button>
        </div>

        <div class="controles-secundarios-descanso">
          <button class="btn-texto" id="btn-pausar-descanso" disabled>Pausar</button>
          <button class="btn-texto btn-saltar" id="btn-saltar-descanso" disabled>Saltar descanso</button>
        </div>
      </section>

      <label class="observaciones-label">Observaciones
        <textarea id="input-observaciones" placeholder="Técnica, dolor, cansancio..."></textarea>
      </label>

      <div class="series-registradas" id="series-registradas"></div>
    </section>

    <div class="nav-ejercicio">
      <button class="btn-secundario" id="btn-ejercicio-anterior">← Anterior</button>
      <button class="btn-primario" id="btn-siguiente-ejercicio">Siguiente →</button>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active">Hoy</button>
    <button class="nav-item">Nutrición</button>
    <button class="nav-item">Progreso</button>
    <button class="nav-item">Historial</button>
  </nav>

  <script src="js/rutinas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
